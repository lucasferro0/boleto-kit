name: BoletoKit CI
on:
  pull_request:
    branches:
      - '*'
jobs:
  develop:
    name: Develop enviroment (PHP ${{ matrix.php }})
    runs-on: ubuntu-22.04
    if: ${{ github.base_ref == 'develop' }}
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout project
        id: step-checkout-project
        uses: actions/checkout@v6

      - name: Setup php ${{ matrix.php }}
        id: step-setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Composer install
        id: step-composer-install
        run: |
          composer install

      - name: Running Tests
        id: step-tests
        run: |
          vendor/bin/phpunit tests
